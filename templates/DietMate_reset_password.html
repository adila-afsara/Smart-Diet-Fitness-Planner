<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password — DietMate BD</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<style>

:root {

    --white:#FFFFFF;
    --offwhite:#FFFDF5;
    --red:#D62828;
    --orange:#F77F00;
    --green:#2E8B57;
    --yellow:#F5C518;
    --text:#1A1A1A;
    --muted:#666666;

}


*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


body{

    font-family:'Inter',sans-serif;
    background:var(--offwhite);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}



/* Main card */

.reset-container{

    width:420px;
    background:white;
    padding:45px;
    border-radius:14px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);

}


/* Folk decoration */

.reset-container::before{

    content:"✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿";
    position:absolute;
    top:15px;
    left:0;
    right:0;
    color:var(--orange);
    font-size:15px;
    letter-spacing:3px;

}


.reset-container::after{

    content:"✿ ❀ ✿ ❀ ✿ ❀ ✿ ❀ ✿";
    position:absolute;
    bottom:15px;
    left:0;
    right:0;
    color:var(--orange);
    font-size:15px;
    letter-spacing:3px;

}



/* Logo */

.logo-circle{

    width:70px;
    height:70px;
    background:var(--red);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    margin:20px auto 12px;
    border:4px solid var(--yellow);

}


.logo-name{

    font-family:'Playfair Display',serif;
    font-size:28px;
    font-weight:700;
    color:var(--red);

}


.logo-name span{

    color:var(--green);

}


.tagline{

    color:var(--muted);
    font-size:13px;
    margin-bottom:35px;

}



/* Form */

.title{

    font-family:'Playfair Display',serif;
    font-size:26px;
    margin-bottom:8px;

}


.subtitle{

    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;

}



.input-group{

    margin-bottom:18px;
    text-align:left;

}



label{

    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;

}



input{

    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:2px solid #FFF8CC;
    background:var(--offwhite);
    font-size:14px;

}


input:focus{

    outline:none;
    border-color:var(--orange);
    background:white;

}



button{

    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--red);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:5px;

}


button:hover{

    background:#8B1A1A;

}



/* Messages */

.message{

    background:#FDEAEA;
    color:var(--red);
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:15px;

}


.back{

    display:block;
    margin-top:20px;
    color:var(--orange);
    font-weight:600;
    text-decoration:none;
    font-size:14px;

}


.back:hover{

    color:#8B1A1A;

}


</style>

</head>


<body>


<div class="reset-container">


<div class="logo-circle">
🥗
</div>


<div class="logo-name">
Diet<span>Mate</span> BD
</div>


<div class="tagline">
Smart Diet & Fitness Planner
</div>



<div class="title">
Reset Password 🔐
</div>


<div class="subtitle">
Create a new password to continue your health journey.
</div>



{% if messages %}

{% for message in messages %}

<div class="message">

{{ message }}

</div>

{% endfor %}

{% endif %}




<form method="POST">

{% csrf_token %}


<div class="input-group">

<label>
🔒 New Password
</label>

<input 
type="password"
name="password"
placeholder="Enter new password"
required
>

</div>



<div class="input-group">

<label>
🔒 Confirm Password
</label>

<input 
type="password"
name="confirm_password"
placeholder="Confirm new password"
required
>

</div>



<button type="submit">

Update Password 🚀

</button>


</form>



<a class="back" href="{% url 'login' %}">
← Back to Login
</a>



</div>


</body>


</html>
