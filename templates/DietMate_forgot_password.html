<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password — DietMate BD</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<style>

:root {
    --white:#FFFFFF;
    --offwhite:#FFFDF5;
    --red:#D62828;
    --orange:#F77F00;
    --green:#2E8B57;
    --text:#1A1A1A;
    --muted:#666666;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--offwhite);
    font-family:'Inter',sans-serif;

}



.card{

    background:white;
    width:420px;
    padding:40px;
    border-radius:14px;
    border:2px solid #EEE8DA;
    text-align:center;

}



.logo{

    font-family:'Playfair Display',serif;
    font-size:28px;
    font-weight:700;
    margin-bottom:20px;

}


.logo span{

    color:var(--green);

}


.logo{

    color:var(--red);

}



h2{

    font-family:'Playfair Display',serif;
    margin-bottom:10px;

}


p{

    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;

}



.input{

    width:100%;
    padding:12px;
    border-radius:8px;
    border:2px solid #EEE8DA;
    background:#FFFDF5;
    font-size:14px;
    margin-bottom:20px;

}


.input:focus{

    outline:none;
    border-color:var(--orange);

}



.btn{

    width:100%;
    padding:13px;
    background:var(--red);
    color:white;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;

}


.btn:hover{

    background:#8B1A1A;

}



.back{

    display:block;
    margin-top:20px;
    text-decoration:none;
    color:var(--orange);
    font-size:14px;
    font-weight:600;

}



.message{

    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
    background:#FDEAEA;
    color:var(--red);
    font-size:13px;

}


.success{

    background:#E8F5EE;
    color:var(--green);

}


</style>

</head>


<body>


<div class="card">


<div class="logo">
    Diet<span>Mate</span> BD
</div>


<h2>Forgot Password?</h2>


<p>
Enter your registered email address.
We will send you a password reset link.
</p>



{% if messages %}

{% for message in messages %}

<div class="message {% if message.tags == 'success' %}success{% endif %}">
{{ message }}
</div>

{% endfor %}

{% endif %}



<form method="POST" action="{% url 'forgot_password' %}">

{% csrf_token %}


<input
class="input"
type="email"
name="email"
placeholder="Enter your email"
required
>


<button class="btn" type="submit">

Send Reset Link

</button>


</form>



<a class="back" href="{% url 'login' %}">
← Back to Login
</a>


</div>


</body>

</html>
